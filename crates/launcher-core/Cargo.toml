[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VYRO launcher core: Minecraft install, launch and Microsoft auth"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha1 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
futures-util = "0.3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
